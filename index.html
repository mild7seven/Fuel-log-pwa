<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css"><title>Fuel Log</title></head><body><header><h1>Fuel Log</h1><button id="install" hidden>Install</button></header><main><section id="stats" class="stats"></section><nav><button data-tab="log">Isi BBM</button><button data-tab="scan">Scan Struk</button><button data-tab="history">Riwayat</button><button data-tab="vehicle">Kendaraan</button></nav><section id="log" class="tab"><form id="fuelForm"><p id="vehicleRequired" class="notice">Buat profil kendaraan terlebih dahulu sebelum mencatat transaksi.</p><h2>Transaksi BBM</h2><input type="hidden" id="editId"><div class="grid"><label>Kendaraan<select id="vehicleId" required></select></label><label>SPBU<input id="station" required></label><label>Tanggal<input id="date" type="date" required></label><label>Waktu<input id="time" type="time"></label><label>Jenis BBM<select id="fuelType" required></select></label><label>Volume (L)<input id="volume" type="number" min=".001" step=".001" required></label><label>Harga/L<input id="price" type="number" min="1" required></label><label>Total<input id="total" type="number" min="1" required></label><label>No. kendaraan<input id="plate"></label><label>Odometer<input id="odo" type="number" min="0" required></label></div><label><input id="fullTank" type="checkbox"> Full tank</label><label>Catatan<textarea id="notes"></textarea></label><button>Simpan</button><button type="button" id="cancel" hidden>Batal edit</button><p id="error"></p></form></section><section id="scan" class="tab"><div class="card"><h2>Scan Struk BBM</h2><p>OCR hanya mengisi kandidat data. Wajib diperiksa sebelum disimpan.</p><input id="receipt" type="file" accept="image/*" capture="environment"><div id="previewWrap" class="preview" hidden><img id="preview" alt="Pratinjau struk"><div><button type="button" id="rotate">Putar 90°</button><button type="button" id="enhance">Tingkatkan kontras</button></div></div><button id="ocr" disabled>Jalankan OCR</button><p id="ocrStatus"></p><div id="ocrConfidence" class="confidence" hidden></div><pre id="raw"></pre><form id="ocrForm" hidden><div class="grid"><label>SPBU<input id="os"></label><label>Tanggal<input id="od" type="date"></label><label>Waktu<input id="ot" type="time"></label><label>BBM<select id="of"></select></label><label>Liter<input id="ov" type="number" step=".001"></label><label>Harga/L<input id="op" type="number"></label><label>Total<input id="oa" type="number"></label><label>Plat<input id="opl"></label><label>Kendaraan<select id="ovh"></select></label><label>Odometer<input id="oo" type="number" required></label></div><div id="ocrWarnings"></div><p id="ow"></p><button>Konfirmasi & Simpan</button></form></div></section><section id="history" class="tab"><div class="card"><h2>Riwayat</h2><input id="search" placeholder="Cari SPBU / BBM / plat"><div><button id="exportCsv" type="button">Export CSV</button><button id="exportJson" type="button">Backup JSON</button></div><div id="list"></div><div id="receiptArchive"></div></div></section><section id="vehicle" class="tab"><form id="vehicleForm"><h2>Profil Kendaraan</h2><div class="grid"><label>Merek<input id="brand" value="Daihatsu" required></label><label>Model<input id="model" value="Terios TX AT" required></label><label>Tahun<input id="year" type="number" value="2011"></label><label>No. kendaraan<input id="vplate" required></label><label>Kapasitas tangki<input id="tank" type="number" value="45"></label><label>BBM utama<select id="vfuel"></select></label><label>Odometer awal<input id="initial" type="number" value="0" required></label></div><button>Simpan kendaraan</button><p id="vm"></p></form></section></main><footer>Offline-first • tanpa MID fuel level</footer><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="js/db.js"></script><script src="js/calc.js"></script><script src="js/parser.js"></script><script src="js/app.js"></script></body></html>
